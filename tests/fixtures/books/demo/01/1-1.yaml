number: "1.1"
title: Gadget Basics
star: false
blocks:
  - prose: |
      A gadget has weight $\frac{a}{b}$ when a # sign is present.
      Note: the colon-space here must survive, as must \textbf{this}.
  - box: important
    text: |
      Every gadget has a weight: no exceptions.
  - problem:
      ref: "1.1"
      kind: intext
      statement: |
        A gadget weighs $x+3$ units and $x=4$. Find its weight.
      hints:
        - "Substitute the value of $x$ into the expression."
        - "Adding gives a result of 7, which you can now state."
      solution: |
        Plug in: $4+3$ gives the weight, so the secret-solution-one holds.
      answer_type: integer
      answer: "7"
      tutor_hints:
        - "Tutor nudge one: check your arithmetic."
  - problem:
      ref: "1.1.1(a)"
      kind: exercise
      preamble: |
        Let a widget have height $h$ and width $w$.
      statement: |
        Find the area when $h=2$ and $w=5$.
      solution: |
        Multiply to get the combined secret-solution-two.
      answer_type: integer
      answer: "10"
      covers: ["1.1.1(a)", "1.1.1(b)"]
  - problem:
      ref: "1.1.1(b)"
      kind: exercise
      preamble: |
        Let a widget have height $h$ and width $w$.
      statement: |
        Find the perimeter when $h=2$ and $w=5$.
      solution: |
        Add the sides for the combined secret-solution-two.
      answer_type: integer
      answer: "14"
      covers: ["1.1.1(a)", "1.1.1(b)"]
  - problem:
      ref: "1.1.2"
      kind: exercise
      statement: |
        Describe the shape of a gizmo curve.
      solution: |
        See the picture: ![](img/fig.png), ![](img/sol.png) and the secret-solution-three.
      answer_type: self
      answer: ""
  - problem:
      ref: "1.1.3"
      kind: exercise
      statement: |
        Prove that every gadget is a gizmo.
      solution: |
        Secret-solution-four: by definition.
      answer_type: proof
      answer: ""
  - problem:
      ref: "1.1.4"
      kind: challenge
      statement: |
        A gizmo has $n$ cogs and $n^2=81$ with $n>0$. Find $n$.
      hints:
        - "Book hint alpha. ![](img/fig.png)"
        - "Book hint beta."
        - "Book hint gamma."
        - "Book hint delta."
      solution: |
        Take the root; secret-solution-five.
      solution_by: tutor
      answer_type: integer
      answer: "9"
      tutor_hints:
        - "Tutor hint epsilon."
  - problem:
      ref: "1.1.5(a)"
      kind: exercise
      preamble: |
        A sprocket polynomial $s(x)$ has three roots.
      statement: |
        Find the roots of $s(x)$.
      solution: |
        Both parts at once: ![](img/sol.png) and the secret-solution-six.
      answer_type: set
      answer: "-5/2, 1/3, 2"
      covers: ["1.1.5(a)", "1.1.5(b)"]
  - problem:
      ref: "1.1.5(b)"
      kind: exercise
      preamble: |
        A sprocket polynomial $s(x)$ has three roots.
      statement: |
        Explain why the roots fit together.
      solution: |
        Both parts at once: ![](img/sol.png) and the secret-solution-six.
      answer_type: self
      answer: ""
      covers: ["1.1.5(a)", "1.1.5(b)"]
  - prose: |
      A closing figure: ![](img/fig.png) end.
  - box: concept
    text: |
      Boxed figure ![](img/fig.png) too.
